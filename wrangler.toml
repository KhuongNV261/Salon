name = "salon"
compatibility_date = "2024-09-23"

# Domain chính (custom_domain tạo DNS record tự động)
routes = [
  { pattern = "aureliasalon.online", custom_domain = true },
  { pattern = "www.aureliasalon.online", custom_domain = true },
  { pattern = "*.aureliasalon.online/*", zone_name = "aureliasalon.online" }
]

# Serve static files từ thư mục build của frontend
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

# Build configuration
[build]
command = "cd frontend && npm install && npm run build"

# Environment variables cho production (nhánh main)
[vars]
VITE_API_URL = "https://salon-p2ww.onrender.com"

# Cấu hình riêng cho môi trường staging (nhánh staging)
[env.staging]
name = "salon-staging"
routes = [
  { pattern = "test.aureliasalon.online", custom_domain = true }
]
[env.staging.vars]
VITE_API_URL = "https://salon-staging-backend.onrender.com"
