name = "salon"
compatibility_date = "2024-09-23"

# Domain chính (custom_domain tạo DNS record tự động)
routes = [
  { pattern = "khuong2601.io.vn", custom_domain = true },
  { pattern = "www.khuong2601.io.vn", custom_domain = true },
  { pattern = "*.khuong2601.io.vn/*", zone_name = "khuong2601.io.vn" }
]

# Serve static files từ thư mục build của frontend
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

# Build configuration
[build]
command = "cd frontend && npm install && npm run build"

# Environment variables cho build
[vars]
VITE_API_URL = "https://salon-p2ww.onrender.com"
